<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>おかいものカゴ</title><style>
:root{--blue:#4d9fe8;--navy:#243b5a;--pale:#eaf6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#eaf6ff,#f7fbff);font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;color:var(--navy)}button{font:inherit;cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;padding:22px 16px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px}.logo{background:white;border-radius:15px;padding:10px;font-size:24px}h1{font-size:22px;margin:0}.sub{font-size:12px;color:#7890a8;margin-top:4px}.clear{border:1px solid #d5e7f7;background:white;color:#58718a;border-radius:12px;padding:10px;font-size:12px}.card{background:white;border:1px solid #e0edf8;border-radius:22px;padding:17px;box-shadow:0 8px 24px #bdd8ef24}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}h2{font-size:16px;margin:0}.count{font-size:12px;color:#2878bf;background:#edf7ff;border-radius:99px;padding:6px 10px}.empty{text-align:center;padding:25px 8px}.illustration{font-size:48px;background:#f0f8ff;border-radius:28px;width:92px;height:92px;display:grid;place-items:center;margin:0 auto 12px}.empty strong{display:block;font-size:17px;margin-bottom:7px}.empty p{font-size:13px;color:#7890a8;line-height:1.7;margin:0}.item{display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf3f8}.item:last-child{border:0}.emoji{background:#f2f8ff;border-radius:15px;width:50px;height:50px;display:grid;place-items:center;font-size:28px}.name{font-weight:800;font-size:14px;margin-bottom:4px}.unit{font-size:11px;color:#7890a8}.subtotal{text-align:right;font-size:14px;font-weight:800;margin-bottom:7px}.qty{display:flex;align-items:center;gap:8px;justify-content:flex-end}.qty button{border:1px solid #cfe4f7;background:#f4faff;color:#2878bf;border-radius:8px;width:28px;height:28px;font-size:18px}.qty span{font-weight:800}.scan{margin-top:14px;background:#f4faff;border:1px dashed #a9d2f3;border-radius:18px;padding:14px}.scan strong{font-size:14px}.scan p{font-size:11px;line-height:1.6;color:#7890a8;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid button{display:flex;align-items:center;gap:8px;border:1px solid #d8eafa;background:white;border-radius:12px;padding:10px;text-align:left;color:var(--navy)}.food{font-size:23px}.grid b{display:block;font-size:12px}.grid small{font-size:10px;color:#7890a8}.bottom{position:sticky;bottom:0;margin-top:14px;padding:14px 2px 8px;background:linear-gradient(#f7fbff00,#f7fbff 16%)}.totalbox{display:flex;justify-content:space-between;align-items:center;margin:0 5px 12px}.total-label{font-size:13px;color:#657f98}.total{font-size:27px;font-weight:900}.checkout{width:100%;border:0;border-radius:16px;background:var(--blue);color:white;padding:17px;font-weight:850;box-shadow:0 5px 0 #2878bf}.checkout:disabled{opacity:.45;box-shadow:none}.notice{position:fixed;bottom:24px;left:50%;transform:translate(-50%,15px);opacity:0;background:#243b5a;color:white;padding:12px 16px;border-radius:13px;font-size:13px;transition:.2s;pointer-events:none}.notice.show{opacity:1;transform:translate(-50%,0)}.backdrop{position:fixed;inset:0;background:#172e4980;display:none;align-items:center;justify-content:center;padding:20px}.backdrop.show{display:flex}.modal{background:white;border-radius:24px;padding:24px 20px;width:100%;max-width:380px;text-align:center}.modal .big{font-size:44px}.modal p{font-size:13px;color:#7890a8}.receipt{background:#f4faff;border-radius:14px;padding:12px;text-align:left;font-size:12px;margin:15px 0}.rrow{display:flex;justify-content:space-between;padding:5px 0}.finish{width:100%;border:0;border-radius:13px;background:var(--blue);color:white;padding:14px;font-weight:800}
</style></head><body><div class="app"><header><div class="brand"><div class="logo">🛒</div><div><h1>おかいものカゴ</h1><div class="sub">きょうは なにを かおう？</div></div></div><button class="clear" id="clear">カゴを空にする</button></header><section class="card"><div class="head"><h2>カゴの中身</h2><span class="count" id="count">0点</span></div><div class="empty" id="empty"><div class="illustration">🛍️</div><strong>カゴは まだ空っぽ！</strong><p>下の商品ボタンを押してみよう。<br>商品を追加すると、ここに表示されるよ。</p></div><div id="items" hidden></div></section><section class="scan"><strong>📲 商品をカゴに入れよう</strong><p>NFCタグに商品URLを書き込めば、読み取り通知から開いたときに商品を追加できるよ。下のボタンでも試せるよ。</p><div class="grid"><button data-add="onigiri"><span class="food">🍙</span><span><b>おにぎり</b><small>150円</small></span></button><button data-add="bread"><span class="food">🥐</span><span><b>パン</b><small>180円</small></span></button><button data-add="juice"><span class="food">🧃</span><span><b>ジュース</b><small>120円</small></span></button><button data-add="cake"><span class="food">🍰</span><span><b>ケーキ</b><small>350円</small></span></button></div></section><div class="bottom"><div class="totalbox"><div class="total-label">おかいけい</div><div class="total" id="total">0円</div></div><button class="checkout" id="checkout" disabled>お会計する　→</button></div></div><div class="notice" id="notice"></div><div class="backdrop" id="backdrop"><div class="modal"><div class="big">🎉</div><h2>おかいもの できたよ！</h2><p>お買い上げありがとう！きょうのおかいものをふりかえろう。</p><div class="receipt" id="receipt"></div><button class="finish" id="finish">つぎのおかいものへ</button></div></div>
<script>
const P={onigiri:{name:"おにぎり",price:150,emoji:"🍙"},bread:{name:"パン",price:180,emoji:"🥐"},juice:{name:"ジュース",price:120,emoji:"🧃"},cake:{name:"ケーキ",price:350,emoji:"🍰"}};let cart={};try{cart=JSON.parse(localStorage.getItem("okaimono_cart")||"{}")}catch(e){};let timer;const fmt=n=>n.toLocaleString("ja-JP"),sum=()=>Object.entries(cart).reduce((s,[id,q])=>s+P[id].price*q,0),qty=()=>Object.values(cart).reduce((a,b)=>a+b,0);function save(){try{localStorage.setItem("okaimono_cart",JSON.stringify(cart))}catch(e){}}function notice(t){let n=document.getElementById("notice");n.textContent=t;n.classList.add("show");clearTimeout(timer);timer=setTimeout(()=>n.classList.remove("show"),1600)}function beep(){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.frequency.value=780;g.gain.value=.07;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.12);o.onended=()=>c.close()}catch(e){}}function add(id){cart[id]=(cart[id]||0)+1;save();render();beep();notice(P[id].name+"をカゴに入れたよ！")}function change(id,d){cart[id]+=d;if(cart[id]<=0)delete cart[id];save();render()}function render(){let keys=Object.keys(cart).filter(k=>P[k]&&cart[k]>0),items=document.getElementById("items");document.getElementById("empty").hidden=keys.length>0;items.hidden=!keys.length;items.innerHTML="";keys.forEach(id=>{let p=P[id],q=cart[id],e=document.createElement("div");e.className="item";e.innerHTML=`<div class="emoji">${p.emoji}</div><div><div class="name">${p.name}</div><div class="unit">${p.price}円 / こ</div><div class="qty"><button data-id="${id}" data-d="-1" aria-label="1個減らす">−</button><span>${q}</span><button data-id="${id}" data-d="1" aria-label="1個増やす">＋</button></div></div><div class="subtotal">${fmt(p.price*q)}円</div>`;items.appendChild(e)});document.getElementById("count").textContent=qty()+"点";document.getElementById("total").textContent=fmt(sum())+"円";document.getElementById("checkout").disabled=qty()===0}document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>add(b.dataset.add));document.getElementById("items").onclick=e=>{let b=e.target.closest("[data-id]");if(b)change(b.dataset.id,+b.dataset.d)};document.getElementById("clear").onclick=()=>{if(!qty()){notice("カゴは空っぽだよ");return}if(confirm("カゴの中身をぜんぶ空にする？")){cart={};save();render();notice("カゴを空にしたよ")}};document.getElementById("checkout").onclick=()=>{let r=document.getElementById("receipt");r.innerHTML="";Object.entries(cart).forEach(([id,q])=>{let e=document.createElement("div");e.className="rrow";e.innerHTML=`<span>${P[id].emoji} ${P[id].name} × ${q}</span><b>${fmt(P[id].price*q)}円</b>`;r.appendChild(e)});let e=document.createElement("div");e.className="rrow";e.style.borderTop="1px solid #dbeaf7";e.style.fontWeight="900";e.innerHTML=`<span>ごうけい</span><span>${fmt(sum())}円</span>`;r.appendChild(e);document.getElementById("backdrop").classList.add("show")};document.getElementById("finish").onclick=()=>{document.getElementById("backdrop").classList.remove("show");cart={};save();render();notice("またおかいものしてね！")};document.getElementById("backdrop").onclick=e=>{if(e.target.id==="backdrop")e.currentTarget.classList.remove("show")};
render();
// NFC URL連携: NFCタグには、公開済みWebアプリのURL末尾に ?scan=商品ID を付けて書き込む。
// iPhoneではタグをかざした後、表示された通知をタップするとこのページが開き、商品を1点追加する。
(function handleNfcUrl(){
  const url = new URL(window.location.href);
  const scanId = url.searchParams.get("scan") || url.searchParams.get("item");
  if (scanId && P[scanId]) {
    // URLパラメータを消してから追加し、再読み込み時の二重追加を防ぐ。
    url.searchParams.delete("scan");
    url.searchParams.delete("item");
    const cleanUrl = url.pathname + (url.search ? url.search : "") + url.hash;
    try { window.history.replaceState({}, "", cleanUrl); } catch (e) {}
    if (document.readyState === "complete") {
      setTimeout(() => add(scanId), 180);
    } else {
      window.addEventListener("load", () => setTimeout(() => add(scanId), 180), { once: true });
    }
  }
})();
</script></body></html>
